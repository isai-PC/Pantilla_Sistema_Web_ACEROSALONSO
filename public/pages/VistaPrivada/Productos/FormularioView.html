<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nuevo Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-slate-300 text-neutral-900 font-sans h-full m-0">

    <main class="max-w-4xl mx-auto bg-white p-6 md:p-10 rounded-lg shadow-md border border-slate-200 mt-10">

        <div class="mb-8 border-b-2 border-orange-400 pb-4">
            <h1 class="text-2xl md:text-3xl font-bold">Crear Nuevo Producto</h1>
            <p class="text-slate-500 text-sm mt-1">Completa los campos para registrar un nuevo producto</p>
        </div>

        <form id="formCrearProducto" class="space-y-8">

            <section class="p-4 bg-slate-50 border border-slate-200 rounded-md">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Datos</h2>
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1" for="nombre_producto">Nombre del
                            Producto*</label>
                        <input type="text" id="nombre_producto" required
                            class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div>
                </div>
            </section>

            <section class="p-4 bg-slate-50 border border-slate-200 rounded-md">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Categorizar</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1" for="unidad_medida">Unidad de
                            medida</label>
                        <select id="unidad_medida" required
                            class="w-full px-4 py-2 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                            <option value="">-- Seleccione el tipo --</option>
                            <option value="pieza">Pieza</option>
                            <option value="metro">Metro</option>
                            <option value="kg">Kg</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1" for="id_categoria">ID Categoria
                            (Ej: 16)*</label>
                        <input type="number" id="id_categoria" required
                            class="w-full px-4 py-2 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div>
                    <!-- <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1" for="nombre_categoria">Nombre de categoria
                            *</label>
                        <input type="text" id="nombre_categoria" required
                            class="w-full px-4 py-2 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div> -->
                </div>
            </section>

            <section class="p-4 bg-slate-50 border border-slate-200 rounded-md">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Especificaciones Tecnicas
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Calibre</label>
                        <input type="text" id="calibre"
                            class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Metros</label>
                        <input type="number" step="0.01" id="metros"
                            class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Centimetros</label>
                        <input type="number" step="0.01" id="cm"
                            class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Kilos</label>
                        <input type="number" step="0.01" id="kg"
                            class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Ton</label>
                        <input type="text" id="ton"
                            class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">CED</label>
                        <input type="text" id="ced"
                            class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1" for="color">Color</label>
                        <input type="text" id="color" placeholder="Ej: rojo"
                            class="w-full px-4 py-2 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Precio*</label>
                        <input type="number" step="0.01" id="precio" required
                            class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                    </div>
                </div>
            </section>

            <section class="p-4 bg-slate-50 border border-slate-200 border-dashed rounded-md">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Imagen del producto</h2>

                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                    <div class="shrink-0">
                        <p class="text-[11px] text-slate-500 mb-1">Previsualización:</p>
                        <img id="imagen" src="https://via.placeholder.com/150" alt="Preview"
                            class="w-20 h-20 md:w-24 md:h-24 object-cover rounded shadow-sm border border-slate-200 bg-white">
                    </div>

                    <div class="w-full flex flex-col gap-2">
                        <label class="block text-sm font-semibold text-slate-700" for="inputfile">Selecciona un archivo
                            (Opcional)</label>
                        <input type="file" id="inputfile" accept=".jpg,.jpeg,.png,.webp" onchange="previsualizar()"
                            class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-600 hover:file:bg-blue-200 cursor-pointer transition-colors">
                    </div>
                </div>
            </section>

            <section class="pt-6 border-t border-slate-200">
                <div class="flex flex-wrap items-center gap-3">
                    <button type="submit" id="btnGuardarFinal"
                        class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-md shadow-sm transition-colors w-full sm:w-auto text-center">
                        Guardar
                    </button>
                    <button type="reset" onclick="resetFormulario()"
                        class="bg-red-500 border border-slate-300 text-white hover:bg-red-600 font-bold py-2 px-6 rounded-md shadow-sm transition-colors w-full sm:w-auto text-center">
                        Cancelar
                    </button>
                </div>
            </section>
        </form>
    </main>

    <script src="../../../assets/js/CrearProducto.js"></script>
</body>

</html>
