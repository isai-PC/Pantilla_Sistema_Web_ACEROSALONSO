<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <!DOCTYPE html>
    <html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Plantilla Maestra de Formularios</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-slate-300 text-neutral-900 font-sans h-full m-0">

        <main class="max-w-4xl mx-auto bg-white p-6 md:p-10 rounded-lg shadow-md border border-slate-200">

            <div class="mb-8 border-b-2 border-orange-400 pb-4">
                <h1 class="text-2xl md:text-3xl font-bold">Crear Nuevo Producto</h1>
                <p class="text-slate-500 text-sm mt-1">Completa los campos para registrar un nuevo producto</p>
            </div>

            <form action="#" method="POST" enctype="multipart/form-data" class="space-y-8">

                <section class="p-4 bg-slate-50 border border-slate-200 rounded-md">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">
                        Datos
                    </h2>
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1" for="titulo_1col">
                                Nombre del Producto*</label>
                            <input type="text" id="titulo_1col"
                                class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                        </div>
                        <!-- <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1" for="desc_1col">
                                Descripcion
                            </label>
                            <textarea id="desc_1col" rows="4"
                                class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors"></textarea>
                        </div> -->
                    </div>
                </section>

                <section class="p-4 bg-slate-50 border border-slate-200 rounded-md">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">
                        Categorizar
                    </h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1" for="Unidad_medida">Unidad de
                                medida</label>
                            <select id="Unidad_medida"
                                class="w-full px-4 py-2 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                                <option value="">-- Seleccione el tipo de unidad de medida --</option>
                                <option value="1">Opción 1</option>
                                <option value="2">Opción 2</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1" for="Categoria">Seleciohne la
                                Categoria</label>
                            <select id="Categoria"
                                class="w-full px-4 py-2 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                                <option value="">-- Seleccione la categoria --</option>
                                <option value="1">Opción 1</option>
                                <option value="2">Opción 2</option>
                            </select>
                        </div>

                    </div>
                </section>

                <section class="p-4 bg-slate-50 border border-slate-200 rounded-md">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">
                        Especificaciones Tecnicas
                    </h2>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Calibre</label>
                            <input type="number"
                                class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Metros</label>
                            <input type="number"
                                class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">
                                Centimetros
                            </label>
                            <input type="number"
                                class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Kilos</label>
                            <input type="number"
                                class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">
                                CED</label>
                            <input type="text"
                                class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2  gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1" for="Categoria">Seleciohne la
                                Color</label>
                            <select id="Categoria"
                                class="w-full px-4 py-2 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                                <option value="">-- Seleccione el color --</option>
                                <option value="1">Opción 1</option>
                                <option value="2">Opción 2</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">
                                Precio</label>
                            <input type="number"
                                class="w-full px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
                        </div>
                    </div>

                </section>

                <section class="p-4 bg-slate-50 border border-slate-200 border-dashed rounded-md">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">
                        Imagen del producto </h2>
                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">                 
                        <div class="shrink-0">
                            <p class="text-[11px] text-slate-500 mb-1">Imagen actual:</p>
                            <img src="https://via.placeholder.com/150" alt="Preview"
                                class="w-20 h-20 md:w-24 md:h-24 object-cover rounded shadow-sm border border-slate-200 bg-white">
                        </div>
                        <div class="w-full">
                            <label class="block text-sm font-semibold text-slate-700 mb-1" for="file_upload">Selecciona
                                un archivo</label>
                            <input type="file" id="file_upload" accept=".jpg,.jpeg,.png,.webp"
                                class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-orange-100 file:text-orange-600 hover:file:bg-orange-200 cursor-pointer transition-colors">
                            <p class="text-xs text-slate-400 mt-2">Formatos válidos: JPG, PNG, WEBP. Máximo 3MB.</p>
                        </div>
                    </div>
                </section>

                <section class="pt-6 border-t border-slate-200">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 hidden">TIPO 7: Botones de
                        Acción</h2>

                    <div class="flex flex-wrap items-center gap-3"> <!--Este es el que contiene los botones-->
                        <button type="button"
                            class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-6 rounded-md shadow-sm transition-colors w-full sm:w-auto text-center">
                            Guardar
                        </button>
                        <button type="button"
                            class="bg-red-500 border border-slate-300 text-white hover:bg-red-600 font-bold py-2 px-6 rounded-md shadow-sm transition-colors w-full sm:w-auto text-center">
                            Cancelar
                        </button>

                    </div>
                </section>

            </form>
        </main>
    </body>

    </html>
</body>

</html>
