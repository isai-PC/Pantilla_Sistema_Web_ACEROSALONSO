<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Predicción de faltas</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script defer src="prediccion.js"></script>

</head>

<body class="bg-slate-300 text-neutral-900 font-sans min-h-screen flex items-center justify-center">








<div class="w-full max-w-4xl bg-white rounded-lg shadow-md p-6">



   
<section class="mb-10">

    <!-- encabezado -->
    <div class="flex justify-between items-center mb-4">

        <div class="flex gap-3">
            <button onclick="listarEmpleados()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold">
                Empleados
            </button>

            <button onclick="listarDepartamentos()"
                class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-semibold">
                Departamentos
            </button>
        </div>

        <!-- buscador -->
        <input
            id="busqueda"
            type="text"
            placeholder="Buscar..."
            class="border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>


    <!-- tabla -->
    <div class="bg-white rounded-lg shadow-md overflow-x-auto border border-slate-200">
        <table class="w-full text-left border-collapse min-w-[600px]">

            <thead class="bg-slate-100 border-b border-slate-200">
                <tr>
                    <th class="py-3 px-4 font-bold text-slate-700">Nombre</th>
                    <th class="py-3 px-4 font-bold text-slate-700">Departamento</th>
                    <th class="py-3 px-4 font-bold text-slate-700">Puesto</th>
                    <th class="py-3 px-4 font-bold text-slate-700 text-center">Acciones</th>
                </tr>
            </thead>

            <tbody id="tabla-empleados"></tbody>

        </table>
    </div>


    <!-- paginación (solo empleados) -->
    <div class="flex justify-center gap-4 mt-4">

        <button onclick="cambiarPagina(0)"
            class="bg-slate-300 px-4 py-2 rounded-lg">
            ←
        </button>

        <span class="font-semibold">
            Página <span id="paginaActual">1</span>
        </span>

        <button onclick="cambiarPagina(1)"
            class="bg-slate-300 px-4 py-2 rounded-lg">
            →
        </button>

    </div>

</section>









<h2 class="text-2xl font-bold text-slate-800 mb-6 border-b-2 border-orange-400 pb-2">
Predicción de faltas
</h2>

<!-- empleado -->

<div class="mb-6 p-4 border border-slate-200 rounded-md bg-slate-50">

<h3 class="text-lg font-semibold text-slate-700 mb-3">
Empleado
</h3>

<div class="flex flex-col md:flex-row gap-3 items-center">

<div class="flex flex-col w-full">
<label class="text-sm font-semibold text-slate-700 mb-1">
ID Empleado
</label>

<input id="idEmpleado"
class="px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
</div>

<button onclick="generarEmpleado()"
class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-2 rounded-md shadow-sm transition-colors">
Generar
</button>

</div>

</div>


<!-- departamento -->

<div class="mb-6 p-4 border border-slate-200 rounded-md bg-slate-50">

<h3 class="text-lg font-semibold text-slate-700 mb-3">
Departamento
</h3>

<div class="flex flex-col md:flex-row gap-3 items-center">

<div class="flex flex-col w-full">
<label class="text-sm font-semibold text-slate-700 mb-1">
ID Departamento
</label>

<input id="idDepartamento"
class="px-4 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-colors">
</div>

<button onclick="generarDepartamento()"
class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-6 py-2 rounded-md shadow-sm transition-colors">
Generar
</button>

</div>

</div>


<hr class="my-6 border-slate-300">


<div id="resultado" class="p-4 border border-slate-200 rounded-md bg-white shadow-sm">

<h3 class="text-lg font-semibold text-slate-700 mb-4">
Resultados
</h3>

<div class="space-y-2 mb-4">

<p class="text-slate-700">
Faltas históricas:
<span id="historicas" class="font-bold text-slate-900"></span>
</p>

<p class="text-slate-700">
Faltas actuales:
<span id="actuales" class="font-bold text-slate-900"></span>
</p>

<p class="text-slate-700">
Faltas predecidas en los proximos 4 meses:
<span id="pendientes" class="font-bold text-slate-900"></span>
</p>

</div>

<div class="flex flex-wrap gap-3 mb-4">

<button onclick="graficaLineal()"
class="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-5 py-2 rounded-md transition-colors">
Gráfica lineal
</button>

<button onclick="graficaBarras()"
class="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-5 py-2 rounded-md transition-colors">
Gráfica barras
</button>

</div>

<div class="bg-white border border-slate-200 rounded-md p-4">

<canvas id="grafica"></canvas>

</div>

</div>

</div>

</body>

<script src="incidencias.js"></script>


</html>
