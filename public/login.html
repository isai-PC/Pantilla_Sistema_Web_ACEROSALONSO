<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | Aceros Alonso</title>

  <link rel="icon" href="ACASALogoAcerosA.png" type="image/png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="assets/css/output.css" rel="stylesheet" />

  <!-- Libreria para el mensaje -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="fondo min-h-screen flex flex-col">
  <!-- HEADER sin navegación -->
  <header class="w-full bg-[#0f172a] text-white sticky top-0 z-50">
    <div class="w-full px-6 py-4 flex items-center gap-3">
      <img src="ACASALogoAcerosA.png" alt="Logo de Aceros Alonso" class="w-10 md:w-16" />

      <h2 class="text-lg md:text-2xl font-bold">Aceros Alonso</h2>
    </div>
  </header>

  <!-- LOGIN -->
  <main class="flex flex-grow items-center justify-center px-4">
    <section class="bg-white rounded-lg p-8 w-[90%] max-w-md">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800">Iniciar Sesión</h1>

        <p class="text-sm text-slate-500">Accede a tu cuenta</p>
      </div>

      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1">
            Correo electrónico
          </label>

          <input id="correo" type="email" name="correo" placeholder="ejemplo@correo.com"
            class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-orange-400" required />
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1"> Contraseña </label>

          <div class="relative">

            <input id="password" type="password" name="password" placeholder="********"
              class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-1 focus:ring-orange-400 pr-10"
              required>

            <button type="button" onclick="togglePassword()" class="absolute right-3 top-2 text-gray-500">
                <!-- Icono ojo -->
  <svg xmlns="http://www.w3.org/2000/svg" 
    fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" 
    class="w-5 h-5">
    <path stroke-linecap="round" stroke-linejoin="round" 
      d="M2.25 12s3.75-7.5 9.75-7.5S21.75 12 21.75 12s-3.75 7.5-9.75 7.5S2.25 12 2.25 12z" />
    <path stroke-linecap="round" stroke-linejoin="round" 
      d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
  </svg>
            </button>

          </div>
        </div>

        <button onclick="verficarSesion ()" type="submit"
          class="mt-2 bg-orange-500 text-white font-semibold py-2 rounded-md hover:bg-orange-600 transition">
          Entrar
        </button>
      </div>
    </section>
  </main>

  <footer class="bg-slate-900 text-white py-4 text-center z-20 mt-auto w-full">
    <p class="m-0 text-sm text-slate-400">
      Todos los derechos reservados © 2026 Aceros Alonso
    </p>
  </footer>
  <!-- GOOGLE IDENTIFY SERVICES -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- CONTENEDOR DE BOTON -->
  <div id="googleSignInDiv" class="mt-6 text-center">
    <div class="my-4 text-center text-slate-500">o</div>
  </div>
  <script src="assets/js/login/login.js"></script>
</body>

</html>
